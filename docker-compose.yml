name: p2-cdc
x-app: &app
  image: p2-cdc-tools:1
  build: ./cdc
  environment:
    PG_DSN: postgresql://postgres:pg-demo@postgres:5432/operations
    KAFKA_BOOTSTRAP: kafka:9092
    CONNECT_URL: http://connect:8083
    LAKEKEEPER_URL: http://lakekeeper:8181
    S3_URL: http://silo:9000
    TRINO_HOST: trino
x-lakekeeper: &lakekeeper
  image: quay.io/lakekeeper/catalog:v0.15.0
  environment:
    LAKEKEEPER__PG_ENCRYPTION_KEY: p2-demo-metadata-key
    LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://postgres:pg-demo@postgres:5432/catalogdb
    LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://postgres:pg-demo@postgres:5432/catalogdb

services:
  postgres:
    image: postgres:17-bookworm
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    environment:
      POSTGRES_PASSWORD: pg-demo
      POSTGRES_DB: operations
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "127.0.0.1:5542:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "operations"]
      interval: 3s
      timeout: 4s
      retries: 30

  kafka:
    image: apache/kafka:3.9.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 25

  connect:
    image: quay.io/debezium/connect:3.2.1.Final
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: p2-connect
      CONFIG_STORAGE_TOPIC: p2-connect-configs
      OFFSET_STORAGE_TOPIC: p2-connect-offsets
      STATUS_STORAGE_TOPIC: p2-connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    ports:
      - "127.0.0.1:8083:8083"

  silo:
    image: pgsty/silo:RELEASE.2026-09-03T13-18-01Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: silo-root-user
      MINIO_ROOT_PASSWORD: silo-root-password
    volumes:
      - silo:/data
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 4s
      timeout: 5s
      retries: 30

  migrate:
    <<: *lakekeeper
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  lakekeeper:
    <<: *lakekeeper
    command: ["serve"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8181:8181"
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 4s
      timeout: 5s
      retries: 30

  trino:
    image: trinodb/trino:476
    volumes:
      - ./trino/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro
    ports:
      - "127.0.0.1:9999:8080"
    depends_on:
      lakekeeper:
        condition: service_healthy
      silo:
        condition: service_healthy

  setup:
    <<: *app
    command: ["setup"]
    volumes:
      - ./sql:/sql:ro
    depends_on:
      silo:
        condition: service_healthy
      lakekeeper:
        condition: service_healthy
      trino:
        condition: service_started
      connect:
        condition: service_started

  worker:
    <<: *app
    command: ["worker"]
    volumes:
      - ./sql:/sql:ro
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: on-failure

  demo:
    <<: *app
    profiles: ["demo"]
    command: ["demo"]
    volumes:
      - ./sql:/sql:ro
    depends_on:
      worker:
        condition: service_started

volumes:
  pgdata:
  kafka:
  silo:
